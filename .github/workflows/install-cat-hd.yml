name: Install HD cat assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-cat-hd.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified cat asset bundle
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .cat-upload/v20/bundle.part01
            cat .cat-upload/v20/bundle.part02
            cat .cat-upload/v20/bundle.part03
            cat .cat-upload/v20/bundle.part04
            cat .cat-upload/v20/bundle.part05
            cat .cat-upload/v20/fix06a1
            cat .cat-upload/v20/fix06_2
            cat .cat-upload/v20/fix06_3
            cat .cat-upload/v20/bundle.part07
            cat .cat-upload/v20/fix08_1
            cat .cat-upload/v20/fix08_2
            cat .cat-upload/v20/fix08_3
            cat .cat-upload/v20/bundle.part09
            cat .cat-upload/v20/bundle.part10
            cat .cat-upload/v20/bundle.part11
            cat .cat-upload/v20/bundle.part12
            cat .cat-upload/v20/fix13_1
            cat .cat-upload/v20/fix13_2
            cat .cat-upload/v20/fix13_3
            cat .cat-upload/v20/bundle.part14
          } > /tmp/cats.b64
          base64 -d /tmp/cats.b64 > /tmp/cats.zip
          echo 'ec17ff3077b175f52b7c89c2da8140ba12ebaa70d560d291de7c14a804413fe8  /tmp/cats.zip' | sha256sum -c -
          unzip -t /tmp/cats.zip
          unzip -o /tmp/cats.zip -d assets/

      - name: Verify HD assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s assets/cat-celebrate.avif)" -eq 31569
          test "$(stat -c%s assets/cat-eat.avif)" -eq 31063
          test "$(stat -c%s assets/cat-happy.avif)" -eq 32089
          test "$(stat -c%s assets/cat-hungry.avif)" -eq 29877
          test "$(stat -c%s assets/cat-idle.avif)" -eq 32867
          test "$(stat -c%s assets/cat-sleep.avif)" -eq 27851
          sha256sum assets/cat-*.avif

      - name: Switch app to HD AVIF assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('cat-anim.js')
          s = p.read_text()
          for name in ['idle','happy','hungry','sleep','eat','celebrate']:
              s = s.replace(f'./assets/cat-{name}.webp?v=19', f'./assets/cat-{name}.avif?v=20')
          s = s.replace("./cat-anim.css?v=19", "./cat-anim.css?v=20")
          p.write_text(s)

          p = Path('cat-anim.css')
          s = p.read_text().replace('Cat state layer v19:', 'Cat state layer v20:')
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text().replace('cozy-cat-cute-v17', 'cozy-cat-cute-v18')
          for name in ['idle','happy','hungry','sleep','eat','celebrate']:
              s = s.replace(f'./assets/cat-{name}.webp', f'./assets/cat-{name}.avif')
          p.write_text(s)
          PY
          grep -q 'cat-idle.avif?v=20' cat-anim.js
          grep -q 'cat-anim.css?v=20' cat-anim.js
          grep -q 'cozy-cat-cute-v18' sw.js
          grep -q 'cat-sleep.avif' sw.js

      - name: Clean temporary upload files
        shell: bash
        run: |
          rm -rf .cat-upload
          rm -f _probe.bin
          rm -f .github/workflows/install-cat-hd.yml

      - name: Commit HD cat assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install original-resolution cat assets'
          git push
