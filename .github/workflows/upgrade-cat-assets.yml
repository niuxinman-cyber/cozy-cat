name: Upgrade cat assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-cat-assets.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Upscale and sharpen cat images
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          names = ['idle','happy','hungry','sleep','eat','celebrate']
          for name in names:
              path = Path('assets') / f'cat-{name}.webp'
              im = Image.open(path).convert('RGBA')
              if im.size != (512, 512):
                  im = im.resize((512, 512), Image.Resampling.LANCZOS)
              # Very light sharpening: crisp on high-DPI phones without making fur edges harsh.
              im = im.filter(ImageFilter.UnsharpMask(radius=1.0, percent=115, threshold=2))
              im.save(path, 'WEBP', quality=95, method=6)
              print(path, im.size, path.stat().st_size)
          PY

      - name: Refresh cache-busting versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cat-anim.js')
          s = p.read_text()
          s = s.replace('?v=17', '?v=18').replace('cat-anim.css?v=17', 'cat-anim.css?v=18')
          p.write_text(s)
          p = Path('sw.js')
          s = p.read_text().replace('cozy-cat-cute-v15', 'cozy-cat-cute-v16')
          p.write_text(s)
          PY

      - name: Commit upgraded assets
        run: |
          rm -f .github/workflows/upgrade-cat-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cat-*.webp cat-anim.js sw.js .github/workflows/upgrade-cat-assets.yml
          git commit -m 'Upgrade cat images for sharper mobile rendering'
          git push
