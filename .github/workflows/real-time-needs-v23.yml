name: Install real-time cat needs v23

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch-real-time-needs.py
      - name: Verify JavaScript
        run: |
          node --check app-core.js
          node --check app.js
          node --check sw.js
          grep -q "NEEDS_CLOCK_VERSION=2" app-core.js
          grep -q "markCatVisit" app-core.js
          grep -q "app-core.js?v=23" app.js
          grep -q "cozy-cat-cute-v23" sw.js
      - name: Commit changes
        run: |
          rm -f .github/workflows/real-time-needs-v23.yml .github/patch-real-time-needs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js app.js sw.js .github/workflows/real-time-needs-v23.yml .github/patch-real-time-needs.py
          git commit -m "Make cat needs follow real elapsed time"
          git push
