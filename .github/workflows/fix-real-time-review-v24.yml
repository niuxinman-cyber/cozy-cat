name: Finalize real-time needs clocks

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch review focus clock
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')
          old="if(state.quizMode==='review'){if(needs.reviewFocusDay!==dayKey()){state.fish=clamp(state.fish-8);needs.reviewFocusDay=dayKey();saveNeedsMeta();toast('完成复习：摸鱼值 -8 ✨')}}"
          new="if(state.quizMode==='review'){if(needs.reviewFocusDay!==dayKey()){state.fish=clamp(state.fish-8);needs.reviewFocusDay=dayKey();resetFishClock();saveNeedsMeta();toast('完成复习：摸鱼值 -8 ✨')}}"
          if old not in s: raise SystemExit('review focus target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('app.js');s=p.read_text(encoding='utf-8')
          if "import('./app-core.js?v=23')" not in s: raise SystemExit('app-core v23 import not found')
          p.write_text(s.replace("import('./app-core.js?v=23')","import('./app-core.js?v=24')",1),encoding='utf-8')

          p=Path('sw.js');s=p.read_text(encoding='utf-8')
          if 'const CACHE = "cozy-cat-cute-v23";' not in s: raise SystemExit('v23 cache not found')
          p.write_text(s.replace('const CACHE = "cozy-cat-cute-v23";','const CACHE = "cozy-cat-cute-v24";',1),encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check app-core.js
          node --check app.js
          node --check sw.js
          grep -q "reviewFocusDay.*resetFishClock" app-core.js
          grep -q "app-core.js?v=24" app.js
          grep -q "cozy-cat-cute-v24" sw.js
      - name: Commit
        run: |
          rm -f .github/workflows/fix-real-time-review-v24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js app.js sw.js .github/workflows/fix-real-time-review-v24.yml
          git commit -m "Finalize wall-clock cat need timers"
          git push
