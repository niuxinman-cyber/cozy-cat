name: Install living cat needs v22

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch living cat system
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCgpkZWYgcmVwbGFjZV9vbmNlKHBhdGgsIG9sZCwgbmV3LCBsYWJlbCk6CiAgICBwPVBhdGgocGF0aCkKICAgIHM9cC5yZWFkX3RleHQoZW5jb2Rpbmc9J3V0Zi04JykKICAgIGNvdW50PXMuaWQ=PLACEHOLDER' >/tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.py
          python /tmp/patch.py
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check cat-anim.js
          node --check app.js
          node --check save-guard.js
          node --check sw.js
          grep -q "cozy11Needs" app-core.js
          grep -q "fish>=75" cat-anim.js
          grep -q "fish<=55" cat-anim.js
          grep -q "cozy-cat-cute-v19" sw.js
      - name: Commit finished system and remove installer
        run: |
          rm -f .github/workflows/cat-needs-v22.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js cat-anim.js cat-anim.css app.js sw.js save-guard.js .github/workflows/cat-needs-v22.yml
          git commit -m "Add time-based cat needs and natural state transitions"
          git push
