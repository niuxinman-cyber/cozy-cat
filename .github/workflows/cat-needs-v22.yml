name: Install living cat needs v22

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install cat needs v22 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch living cat system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('patched', label)

          # app-core.js: softer copy for petting
          replace_once('app-core.js',
          "const PET=['你一摸，小猫就把脑袋往你手心里顶了顶。♡','呼噜呼噜……这一摸看起来很专业。','小猫眯起眼睛：再摸五分钟也不是不可以。','它把两只前爪往前伸了一点，决定继续赖着。','摸摸成功！猫猫心情 +5。'];",
          "const PET=['你一摸，小猫就把脑袋往你手心里顶了顶。♡','呼噜呼噜……这一摸看起来很专业。','小猫眯起眼睛：再摸五分钟也不是不可以。','它把两只前爪往前伸了一点，决定继续赖着。','摸摸成功！猫猫看起来精神了一点。'];",
          'pet copy')

          # app-core.js: persistent needs / time decay helpers
          old="function save(){normalizeState();localStorage.setItem('cozy9Mood',state.mood);localStorage.setItem('cozy9Fullness',state.full);localStorage.setItem('cozy9Fish',state.fish);localStorage.setItem('cozy9Inventory',JSON.stringify(state.inventory));localStorage.setItem('cozy10LastCheckin',state.lastCheckin);localStorage.setItem('cozy10CheckinStreak',state.streak);localStorage.setItem('cozyLearningV4',JSON.stringify(learning));localStorage.setItem('cozy9Learned-'+dayKey(),JSON.stringify(currentLearned()));localStorage.setItem('cozy9Claimed-'+dayKey(),JSON.stringify(currentClaimed()))}\nfunction speech(t){const e=$('#speech');if(e)e.innerHTML=t}"
          new="""function save(){normalizeState();localStorage.setItem('cozy9Mood',state.mood);localStorage.setItem('cozy9Fullness',state.full);localStorage.setItem('cozy9Fish',state.fish);localStorage.setItem('cozy9Inventory',JSON.stringify(state.inventory));localStorage.setItem('cozy10LastCheckin',state.lastCheckin);localStorage.setItem('cozy10CheckinStreak',state.streak);localStorage.setItem('cozyLearningV4',JSON.stringify(learning));localStorage.setItem('cozy9Learned-'+dayKey(),JSON.stringify(currentLearned()));localStorage.setItem('cozy9Claimed-'+dayKey(),JSON.stringify(currentClaimed()))}
const HOUR=60*60*1000;
function loadNeedsMeta(){
  const now=Date.now();let n=safeParse(localStorage.getItem('cozy11Needs'),{})||{};
  const last=Number(n.lastActivity)||now;n.lastActivity=last;
  n.nextFull=Number(n.nextFull)||last+3*HOUR;
  n.nextMood=Number(n.nextMood)||last+9*HOUR;
  n.nextFish=Number(n.nextFish)||last+4*HOUR;
  n.petTimes=Array.isArray(n.petTimes)?n.petTimes.map(Number).filter(Number.isFinite):[];
  n.batchFocus=Array.isArray(n.batchFocus)?n.batchFocus:[];
  n.quizFocus=Array.isArray(n.quizFocus)?n.quizFocus:[];
  n.reviewFocusDay=String(n.reviewFocusDay||'');n.returnBonusDay=String(n.returnBonusDay||'');
  return n;
}
const needs=loadNeedsMeta();
function saveNeedsMeta(){needs.petTimes=needs.petTimes.slice(-20);needs.batchFocus=needs.batchFocus.slice(-120);needs.quizFocus=needs.quizFocus.slice(-120);localStorage.setItem('cozy11Needs',JSON.stringify(needs))}
function markCatActivity(now=Date.now()){
  needs.lastActivity=now;needs.nextFull=now+3*HOUR;needs.nextMood=now+9*HOUR;needs.nextFish=now+4*HOUR;saveNeedsMeta();
}
function applyPassiveNeeds(now=Date.now()){
  let changed=false;
  if(now>=needs.nextFull){const steps=Math.floor((now-needs.nextFull)/HOUR)+1;state.full=clamp(state.full-steps);needs.nextFull+=steps*HOUR;changed=true}
  if(now>=needs.nextFish){const steps=Math.floor((now-needs.nextFish)/(2*HOUR))+1;state.fish=clamp(state.fish+steps*3);needs.nextFish+=steps*2*HOUR;changed=true}
  let guard=0;while(now>=needs.nextMood&&guard++<10000){state.mood=clamp(state.mood-1);const age=needs.nextMood-needs.lastActivity;needs.nextMood+=age>=24*HOUR?2*HOUR:3*HOUR;changed=true}
  saveNeedsMeta();return changed;
}
function maybeReturnBonus(awayMs){if(awayMs<6*HOUR||needs.returnBonusDay===dayKey())return false;state.mood=clamp(state.mood+3);needs.returnBonusDay=dayKey();saveNeedsMeta();return true}
function catMoodLine(){if(state.mood<20)return'猫猫缩成一小团，今天不太想动。<br>不过你回来以后，它悄悄抬头看了你一眼。';if(state.mood<40)return'猫猫今天有点蔫，安安静静地趴着。<br>好像已经等你一阵子啦。';if(state.mood<70)return'猫猫今天有一点安静，<br>听见你回来以后尾巴轻轻动了一下。';return'听见你回来，小猫立刻抬起头看你。♡'}
function applyFocusOnce(bucket,token,amount){const list=needs[bucket];if(list.includes(token))return false;list.push(token);state.fish=clamp(state.fish-amount);saveNeedsMeta();return true}
function speech(t){const e=$('#speech');if(e)e.innerHTML=t}"""
          replace_once('app-core.js',old,new,'needs helpers')

          # app-core.js: richer status labels
          old="function renderStatus(){normalizeState();[['mood',state.mood],['food',state.full],['fish',state.fish]].forEach(([k,v])=>{const n=$('#'+k+'Num'),b=$('#'+(k==='food'?'food':k)+'Bar');if(n)n.textContent=Math.round(v)+'%';if(b)b.style.width=v+'%'});const pm=$('#profileMood');if(pm)pm.textContent=state.full>=75?'吃饱啦':state.mood>=80?'很开心':state.fish>=70?'在摸鱼':'在等你'}"
          new="function catStatusText(){if(state.full<=28)return'饿坏啦';if(state.mood<20)return'很失落';if(state.mood<40)return'有点蔫';if(state.fish>=75)return'睡着了';if(state.mood<70)return'有点安静';if(state.full>=75)return'吃饱啦';if(state.mood>=80)return'很开心';return'在等你'}\nfunction renderStatus(){normalizeState();[['mood',state.mood],['food',state.full],['fish',state.fish]].forEach(([k,v])=>{const n=$('#'+k+'Num'),b=$('#'+(k==='food'?'food':k)+'Bar');if(n)n.textContent=Math.round(v)+'%';if(b)b.style.width=v+'%'});const pm=$('#profileMood');if(pm)pm.textContent=catStatusText()}"
          replace_once('app-core.js',old,new,'status text')

          # app-core.js: study batch focus reward, pet anti-spam, work action
          old="function toggle(i){const learned=currentLearned();const p=learned.indexOf(i);if(p>=0)learned.splice(p,1);else{learned.push(i);const id=currentWords()[i]?.id;if(id&&!learning.seen.includes(id))learning.seen.push(id)}state.mood=clamp(state.mood+.8);renderWords();rewards();renderStatus();renderSummary();save()}\nfunction pet(){state.mood=clamp(state.mood+5);state.fish=clamp(state.fish+2);speech(PET[Math.floor(Math.random()*PET.length)]);animate('petting');hearts();renderStatus();renderSummary();save()}\nfunction work(){state.fish=clamp(state.fish+10);state.full=clamp(state.full-2);speech(WORK[Math.floor(Math.random()*WORK.length)]);renderStatus();renderSummary();save()}"
          new="""function toggle(i){const learned=currentLearned();const p=learned.indexOf(i);if(p>=0)learned.splice(p,1);else{learned.push(i);const id=currentWords()[i]?.id;if(id&&!learning.seen.includes(id))learning.seen.push(id)}state.mood=clamp(state.mood+.8);if(p<0&&learned.length===20){const token=dayKey()+':'+currentBatch();if(applyFocusOnce('batchFocus',token,8))toast('学完这一组：摸鱼值 -8 ✨')}renderWords();rewards();renderStatus();renderSummary();save()}
function pet(){const now=Date.now();needs.petTimes=needs.petTimes.filter(t=>now-t<15*60*1000);const tier=Math.min(needs.petTimes.length,3),moodGain=[8,5,2,0][tier],fishDrop=[2,1,1,0][tier];needs.petTimes.push(now);saveNeedsMeta();state.mood=clamp(state.mood+moodGain);state.fish=clamp(state.fish-fishDrop);const extra=moodGain?`<br>心情 +${moodGain}${fishDrop?`，摸鱼值 -${fishDrop}`:''}`:'<br>它已经被摸得很满足啦，再摸也只负责呼噜。';speech(PET[Math.floor(Math.random()*PET.length)]+extra);animate('petting');hearts();renderStatus();renderSummary();save()}
function work(){state.fish=clamp(state.fish+10);state.full=clamp(state.full-2);speech(WORK[Math.floor(Math.random()*WORK.length)]);renderStatus();renderSummary();save()}"""
          replace_once('app-core.js',old,new,'interaction tuning')

          # app-core.js: feeding wakes the cat a little
          old="function feed(k,source){if(!(state.inventory[k]>0)){toast('这个奖励还没有哦，先去学单词吧');return}state.inventory[k]--;state.full=clamp(state.full+FOOD[k].full);state.mood=clamp(state.mood+FOOD[k].mood);closeReward();page('home');setTimeout(()=>{flyFood(k,source);setTimeout(()=>{animate('eating');hearts()},560)},80);speech(`${FOOD[k].emoji} ${FOOD[k].name}送达！小猫认真开饭啦。`);renderInventory();renderStatus();renderSummary();save()}"
          new="function feed(k,source){if(!(state.inventory[k]>0)){toast('这个奖励还没有哦，先去学单词吧');return}state.inventory[k]--;state.full=clamp(state.full+FOOD[k].full);state.mood=clamp(state.mood+FOOD[k].mood);state.fish=clamp(state.fish-4);closeReward();page('home');setTimeout(()=>{flyFood(k,source);setTimeout(()=>{animate('eating');hearts()},560)},80);speech(`${FOOD[k].emoji} ${FOOD[k].name}送达！小猫认真开饭啦。<br>摸鱼值 -4`);renderInventory();renderStatus();renderSummary();save()}"
          replace_once('app-core.js',old,new,'feeding focus')

          # app-core.js: quiz / review focus rewards are one-time per batch/day to prevent farming
          old="  state.mood=clamp(state.mood+state.score);renderInventory();renderStatus();renderWords();renderSummary();save();"
          new="  if(state.quizMode==='review'){if(needs.reviewFocusDay!==dayKey()){state.fish=clamp(state.fish-8);needs.reviewFocusDay=dayKey();saveNeedsMeta();toast('完成复习：摸鱼值 -8 ✨')}}else{const token=dayKey()+':'+currentBatch();if(applyFocusOnce('quizFocus',token,10))toast('完成小测：摸鱼值 -10 ✨')}\n  state.mood=clamp(state.mood+state.score);renderInventory();renderStatus();renderWords();renderSummary();save();"
          replace_once('app-core.js',old,new,'quiz focus')

          # app-core.js: summary text uses same status logic
          old="function renderSummary(){$('#sumQuiz').textContent=state.quizRewarded?'已领取':'未领取';$('#sumCat').textContent=state.full>=75?'吃饱啦':state.mood>=80?'很开心':state.fish>=70?'在摸鱼':'在等你'}"
          new="function renderSummary(){$('#sumQuiz').textContent=state.quizRewarded?'已领取':'未领取';$('#sumCat').textContent=catStatusText()}"
          replace_once('app-core.js',old,new,'summary status')

          # app-core.js: lifecycle, return bonus, passive decay and 10-minute active-focus reward
          old="$('#petBtn').addEventListener('click',pet);$('#cat').addEventListener('click',pet);$('#quickFeedBtn').addEventListener('click',quickFeed);$('#workBtn').addEventListener('click',work);$('#checkinBtn').addEventListener('click',checkin);$('#eventBtn').addEventListener('click',event);"
          new="""const cozyStartedAt=Date.now(),cozyAway=cozyStartedAt-needs.lastActivity;
const cozyPassiveChanged=applyPassiveNeeds(cozyStartedAt),cozyReturnBonus=maybeReturnBonus(cozyAway);
markCatActivity(cozyStartedAt);if(cozyPassiveChanged||cozyReturnBonus){renderStatus();renderSummary();save()}if(cozyAway>=6*HOUR)speech(catMoodLine());
let cozyLastInput=cozyStartedAt,cozyActiveSeconds=0;
function cozyUserActive(){cozyLastInput=Date.now();markCatActivity(cozyLastInput)}
document.addEventListener('pointerdown',cozyUserActive,true);document.addEventListener('keydown',cozyUserActive,true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const now=Date.now(),away=now-needs.lastActivity,changed=applyPassiveNeeds(now),bonus=maybeReturnBonus(away);markCatActivity(now);cozyLastInput=now;if(changed||bonus){renderStatus();renderSummary();save()}if(away>=6*HOUR)speech(catMoodLine())});
setInterval(()=>{const now=Date.now();let changed=applyPassiveNeeds(now);if(!document.hidden&&now-cozyLastInput<2*60*1000){cozyActiveSeconds+=60;if(cozyActiveSeconds>=600){cozyActiveSeconds=0;state.fish=clamp(state.fish-3);toast('陪猫学习 10 分钟：摸鱼值 -3 ✨');changed=true}}else cozyActiveSeconds=0;if(changed){renderStatus();renderSummary();save()}},60*1000);
$('#petBtn').addEventListener('click',pet);$('#cat').addEventListener('click',pet);$('#quickFeedBtn').addEventListener('click',quickFeed);$('#workBtn').addEventListener('click',work);$('#checkinBtn').addEventListener('click',checkin);$('#eventBtn').addEventListener('click',event);"""
          replace_once('app-core.js',old,new,'needs lifecycle')

          # cat-anim.js: idle is true default; hunger > sleep; 75 sleep / 55 wake hysteresis; mood only changes demeanor
          p=Path('cat-anim.js');s=p.read_text(encoding='utf-8')
          old="function cozyCatBaseState(){const mood=cozyCatReadNumber('cozy9Mood',80),full=cozyCatReadNumber('cozy9Fullness',60),fish=cozyCatReadNumber('cozy9Fish',30);if(full<=28)return'hungry';if(fish>=82)return'sleep';if(mood>=85)return'happy';return'idle'}"
          new="function cozyCatBaseState(){const full=cozyCatReadNumber('cozy9Fullness',60),fish=cozyCatReadNumber('cozy9Fish',30);let sleeping=localStorage.getItem('cozy11CatSleeping')==='1';if(full<=28){localStorage.setItem('cozy11CatSleeping','0');return'hungry'}if(sleeping&&fish<=55){sleeping=false;localStorage.setItem('cozy11CatSleeping','0')}if(!sleeping&&fish>=75){sleeping=true;localStorage.setItem('cozy11CatSleeping','1')}return sleeping?'sleep':'idle'}"
          if s.count(old)!=1: raise SystemExit('cat base state match failed')
          s=s.replace(old,new,1)
          old="function cozyCatSetState(name){const img=document.getElementById('cat'),wrap=document.getElementById('catWrap');if(!img||!wrap||!COZY_CAT_ASSETS[name])return;cozyCatCurrentState=name;COZY_CAT_STATE_CLASSES.forEach(c=>wrap.classList.remove(c));wrap.classList.add(`state-${name}`);const wanted=COZY_CAT_ASSETS[name];if(img.getAttribute('src')!==wanted)img.setAttribute('src',wanted);img.dataset.catState=name}"
          new="function cozyCatSetState(name){const img=document.getElementById('cat'),wrap=document.getElementById('catWrap');if(!img||!wrap||!COZY_CAT_ASSETS[name])return;cozyCatCurrentState=name;COZY_CAT_STATE_CLASSES.forEach(c=>wrap.classList.remove(c));wrap.classList.remove('mood-good','mood-mid','mood-low','mood-very-low');const mood=cozyCatReadNumber('cozy9Mood',80);wrap.classList.add(`state-${name}`,mood<20?'mood-very-low':mood<40?'mood-low':mood<70?'mood-mid':'mood-good');const wanted=COZY_CAT_ASSETS[name];if(img.getAttribute('src')!==wanted)img.setAttribute('src',wanted);img.dataset.catState=name}"
          if s.count(old)!=1: raise SystemExit('cat set state match failed')
          s=s.replace(old,new,1).replace('?v=21','?v=22').replace('cat-anim.css?v=21','cat-anim.css?v=22')
          p.write_text(s,encoding='utf-8')

          # cat-anim.css: low mood = quieter/lower breathing, without blur-inducing filters
          p=Path('cat-anim.css');s=p.read_text(encoding='utf-8').replace('Cat state layer v20','Cat state layer v22')
          needle=".cat-wrap.state-hungry{animation:catHungryBreath 3.9s ease-in-out infinite}\n.cat-wrap.state-sleep{animation:catSleepBreath 4.8s ease-in-out infinite}"
          repl=".cat-wrap.state-hungry{animation:catHungryBreath 3.9s ease-in-out infinite}\n.cat-wrap.state-idle.mood-mid{animation:catIdleBreath 4.5s ease-in-out infinite}\n.cat-wrap.state-idle.mood-low{animation:catLowMoodBreath 5.5s ease-in-out infinite}\n.cat-wrap.state-idle.mood-very-low{animation:catVeryLowMoodBreath 6.5s ease-in-out infinite}\n.cat-wrap.state-sleep{animation:catSleepBreath 4.8s ease-in-out infinite}"
          if s.count(needle)!=1: raise SystemExit('css mood insertion match failed')
          s=s.replace(needle,repl,1)
          needle="@keyframes catHungryBreath{0%,100%{transform:translateY(0)}48%{transform:translateY(-1px)}62%{transform:translateY(1px)}}\n@keyframes catSleepBreath"
          repl="@keyframes catHungryBreath{0%,100%{transform:translateY(0)}48%{transform:translateY(-1px)}62%{transform:translateY(1px)}}\n@keyframes catLowMoodBreath{0%,100%{transform:translateY(2px)}50%{transform:translateY(1px)}}\n@keyframes catVeryLowMoodBreath{0%,100%{transform:translateY(3px)}50%{transform:translateY(2px)}}\n@keyframes catSleepBreath"
          if s.count(needle)!=1: raise SystemExit('css keyframe insertion match failed')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          # app.js: hard cache-bust both runtime modules
          Path('app.js').write_text("// Stable loader: start the cat animation layer directly, then run the existing app logic.\n// Versioned imports keep iPhone Safari/PWA caches from pinning older behavior.\nimport('./cat-anim.js?v=22').catch(err=>console.error('cat-anim load failed',err));\nimport('./app-core.js?v=22').catch(err=>console.error('app-core load failed',err));\n",encoding='utf-8')

          # sw.js: new cache generation
          p=Path('sw.js');s=p.read_text(encoding='utf-8')
          if 'cozy-cat-cute-v18' not in s: raise SystemExit('sw cache version not found')
          p.write_text(s.replace('cozy-cat-cute-v18','cozy-cat-cute-v19',1),encoding='utf-8')

          # save-guard.js: preserve the new needs metadata and sleep hysteresis in export/import
          p=Path('save-guard.js');s=p.read_text(encoding='utf-8')
          needle='    return save;\n  }\n  function normalize(data){'
          repl='    save.needs=parse(localStorage.getItem("cozy11Needs"),null);save.sleeping=localStorage.getItem("cozy11CatSleeping")==="1";\n    return save;\n  }\n  function normalize(data){'
          if s.count(needle)!=1: raise SystemExit('save collect insertion failed')
          s=s.replace(needle,repl,1)
          needle='    return out;\n  }\n  function saveMaster(data,backup=true)'
          repl='    out.needs=data.needs||null;out.sleeping=Boolean(data.sleeping);\n    return out;\n  }\n  function saveMaster(data,backup=true)'
          if s.count(needle)!=1: raise SystemExit('save normalize insertion failed')
          s=s.replace(needle,repl,1)
          needle='}return true}\n  function hasCurrentData()'
          repl='}if(s.needs)localStorage.setItem("cozy11Needs",JSON.stringify(s.needs));else localStorage.removeItem("cozy11Needs");localStorage.setItem("cozy11CatSleeping",s.sleeping?"1":"0");return true}\n  function hasCurrentData()'
          if s.count(needle)!=1: raise SystemExit('save restore insertion failed')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check cat-anim.js
          node --check app.js
          node --check save-guard.js
          node --check sw.js
          grep -q "cozy11Needs" app-core.js
          grep -q "fish>=75" cat-anim.js
          grep -q "fish<=55" cat-anim.js
          grep -q "cozy-cat-cute-v19" sw.js
      - name: Commit finished system and remove installer
        run: |
          rm -f .github/workflows/cat-needs-v22.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js cat-anim.js cat-anim.css app.js sw.js save-guard.js .github/workflows/cat-needs-v22.yml
          git commit -m "Add time-based cat needs and natural state transitions"
          git push
