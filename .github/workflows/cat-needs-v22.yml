name: Install living cat needs v22

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and run patch script
        run: |
          git show 6ebdbad38d23e4b9fe86b606e32d1698ed70ddd6:.github/workflows/cat-needs-v22.yml > /tmp/original.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/original.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if x.strip()=="python - <<'PY'")+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          block=lines[start:end]
          cleaned=[]
          for line in block:
              cleaned.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/patch.py').write_text('\n'.join(cleaned)+'\n',encoding='utf-8')
          PY
          python /tmp/patch.py
      - name: Syntax checks
        run: |
          node --check app-core.js
          node --check cat-anim.js
          node --check app.js
          node --check save-guard.js
          node --check sw.js
          grep -q "cozy11Needs" app-core.js
          grep -q "fish>=75" cat-anim.js
          grep -q "fish<=55" cat-anim.js
          grep -q "cozy-cat-cute-v19" sw.js
      - name: Commit finished system and remove installer
        run: |
          rm -f .github/workflows/cat-needs-v22.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js cat-anim.js cat-anim.css app.js sw.js save-guard.js .github/workflows/cat-needs-v22.yml
          git commit -m "Add time-based cat needs and natural state transitions"
          git push
