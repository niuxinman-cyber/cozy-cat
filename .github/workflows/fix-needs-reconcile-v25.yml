name: Fix cat needs reconciliation v25

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run needs reconciliation fix v25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch real-time needs reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')
          old="function maybeReturnBonus(awayMs,now=Date.now()){if(awayMs<6*HOUR||needs.returnBonusDay===dayKey())return false;state.mood=clamp(state.mood+3);needs.returnBonusDay=dayKey();resetMoodClock(now);saveNeedsMeta();return true}"
          if old not in s: raise SystemExit('return bonus target not found')
          s=s.replace(old,"function maybeReturnBonus(){return false}",1)
          start=s.index("const cozyStartedAt=Date.now(),cozyAway=cozyStartedAt-needs.lastVisitAt;")
          end=s.index("\n$('#petBtn')",start)
          new=("const cozyStartedAt=Date.now();\n"
               "function reconcileCatNeeds(now=Date.now(),speakOnReturn=false){\n"
               "  const away=Math.max(0,now-needs.lastVisitAt),changed=applyPassiveNeeds(now);\n"
               "  markCatVisit(now);\n"
               "  if(changed){renderStatus();renderSummary();save()}\n"
               "  if(speakOnReturn&&away>=6*HOUR)speech(catMoodLine());\n"
               "  return{away,changed};\n"
               "}\n"
               "reconcileCatNeeds(cozyStartedAt,true);\n"
               "let cozyLastInput=cozyStartedAt,cozyActiveSeconds=0;\n"
               "function cozyUserActive(){const now=Date.now();if(now-needs.lastVisitAt>60*1000)reconcileCatNeeds(now,false);else markCatVisit(now);cozyLastInput=now}\n"
               "document.addEventListener('pointerdown',cozyUserActive,true);document.addEventListener('keydown',cozyUserActive,true);\n"
               "document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const now=Date.now();reconcileCatNeeds(now,true);cozyLastInput=now}});\n"
               "window.addEventListener('focus',()=>{const now=Date.now();reconcileCatNeeds(now,false);cozyLastInput=now});\n"
               "window.addEventListener('pageshow',()=>{const now=Date.now();reconcileCatNeeds(now,false);cozyLastInput=now});\n"
               "setInterval(()=>{const now=Date.now();let changed=applyPassiveNeeds(now);if(!document.hidden&&now-cozyLastInput<2*60*1000){cozyActiveSeconds+=60;if(cozyActiveSeconds>=600){cozyActiveSeconds=0;state.fish=clamp(state.fish-3);resetFishClock(now);toast('陪猫学习 10 分钟：摸鱼值 -3 ✨');changed=true}}else cozyActiveSeconds=0;if(changed){renderStatus();renderSummary();save()}},60*1000);")
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          p=Path('app.js');s=p.read_text(encoding='utf-8')
          if "import('./app-core.js?v=24')" not in s: raise SystemExit('app-core v24 import not found')
          p.write_text(s.replace("import('./app-core.js?v=24')","import('./app-core.js?v=25')",1),encoding='utf-8')
          p=Path('sw.js');s=p.read_text(encoding='utf-8')
          if 'const CACHE = "cozy-cat-cute-v24";' not in s: raise SystemExit('v24 cache not found')
          p.write_text(s.replace('const CACHE = "cozy-cat-cute-v24";','const CACHE = "cozy-cat-cute-v25";',1),encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check app-core.js
          node --check app.js
          node --check sw.js
          grep -q "function maybeReturnBonus(){return false}" app-core.js
          grep -q "window.addEventListener('focus'" app-core.js
          grep -q "window.addEventListener('pageshow'" app-core.js
          grep -q "app-core.js?v=25" app.js
          grep -q "cozy-cat-cute-v25" sw.js
      - name: Commit
        run: |
          rm -f .github/workflows/fix-needs-reconcile-v25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js app.js sw.js .github/workflows/fix-needs-reconcile-v25.yml
          git commit -m "Make background cat needs reconcile reliably"
          git push
