name: Fix world collectible persistence v26

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run world persistence fix v26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch collectible persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('cozy-world.js')
          s=p.read_text(encoding='utf-8')
          old="""function progressFor(item){if(item.kind==='words')return learningSeen();if(item.kind==='streak')return getNum('cozy10CheckinStreak',0);if(item.kind==='reviews')return metrics().reviewDays.length;return 0}
function isUnlocked(item){return progressFor(item)>=item.need}
function equipped(){const x=parse(localStorage.getItem(EQUIPPED_KEY),[]);return Array.isArray(x)?x.filter(id=>ITEMS.some(i=>i.id===id)):[]}
function saveEquipped(list){localStorage.setItem(EQUIPPED_KEY,JSON.stringify([...new Set(list)]))}"""
          new="""function progressFor(item){if(item.kind==='words')return learningSeen();if(item.kind==='streak')return getNum('cozy10CheckinStreak',0);if(item.kind==='reviews')return metrics().reviewDays.length;return 0}
function knownUnlocks(){const x=parse(localStorage.getItem(KNOWN_KEY),[]);return Array.isArray(x)?x.filter(id=>ITEMS.some(i=>i.id===id)):[]}
function isUnlocked(item){return knownUnlocks().includes(item.id)||progressFor(item)>=item.need}
function equipped(){
  const raw=localStorage.getItem(EQUIPPED_KEY);
  if(raw===null){const defaults=ITEMS.filter(isUnlocked).map(i=>i.id);saveEquipped(defaults);return defaults}
  const x=parse(raw,[]);return Array.isArray(x)?x.filter(id=>ITEMS.some(i=>i.id===id)):[]
}
function saveEquipped(list){localStorage.setItem(EQUIPPED_KEY,JSON.stringify([...new Set(list)]))}"""
          if old not in s: raise SystemExit('cozy-world unlock block not found')
          s=s.replace(old,new,1)

          old="""  for(const item of ITEMS){
    const p=progressFor(item),open=p>=item.need,on=eq.includes(item.id);
    const card=document.createElement('div');card.className='world-collect-card'+(open?' is-open':' is-locked');
    card.innerHTML=`<div class=\"world-collect-emoji\">${open?item.emoji:'🔒'}</div><div class=\"world-collect-name\">${open?item.name:'???'}</div><div class=\"world-collect-rule\">${item.rule}</div><div class=\"world-collect-progress\">${Math.min(p,item.need)} / ${item.need}</div><button type=\"button\" ${open?'':'disabled'}>${open?(on?'收起来':'放进猫窝'):'还没解锁'}</button>`;"""
          new="""  for(const item of ITEMS){
    const p=progressFor(item),open=isUnlocked(item),on=eq.includes(item.id),progressText=open&&p<item.need?'已永久解锁':`${Math.min(p,item.need)} / ${item.need}`;
    const card=document.createElement('div');card.className='world-collect-card'+(open?' is-open':' is-locked');
    card.innerHTML=`<div class=\"world-collect-emoji\">${open?item.emoji:'🔒'}</div><div class=\"world-collect-name\">${open?item.name:'???'}</div><div class=\"world-collect-rule\">${item.rule}</div><div class=\"world-collect-progress\">${progressText}</div><button type=\"button\" ${open?'':'disabled'}>${open?(on?'收起来':'放进猫窝'):'还没解锁'}</button>`;"""
          if old not in s: raise SystemExit('cozy-world render block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('save-guard.js')
          s=p.read_text(encoding='utf-8')
          old='''    save.needs=parse(localStorage.getItem("cozy11Needs"),null);save.sleeping=localStorage.getItem("cozy11CatSleeping")==="1";
    return save;'''
          new='''    save.needs=parse(localStorage.getItem("cozy11Needs"),null);save.sleeping=localStorage.getItem("cozy11CatSleeping")==="1";
    save.world={equipped:parse(localStorage.getItem("cozyWorldEquippedV1"),null),knownUnlocks:parse(localStorage.getItem("cozyWorldKnownUnlocksV1"),null),metrics:parse(localStorage.getItem("cozyWorldMetricsV1"),null)};
    return save;'''
          if old not in s: raise SystemExit('save collect target not found')
          s=s.replace(old,new,1)

          old='''    out.needs=data.needs||null;out.sleeping=Boolean(data.sleeping);
    return out;'''
          new='''    out.needs=data.needs||null;out.sleeping=Boolean(data.sleeping);const w=data.world||{};out.world={equipped:Array.isArray(w.equipped)?w.equipped:null,knownUnlocks:Array.isArray(w.knownUnlocks)?w.knownUnlocks:null,metrics:w.metrics&&typeof w.metrics==="object"?w.metrics:null};
    return out;'''
          if old not in s: raise SystemExit('save normalize target not found')
          s=s.replace(old,new,1)

          old='''  function restore(data){const s=normalize(data);if(!s)return false;const p=s.profile;localStorage.setItem("cozy9Mood",String(p.mood));localStorage.setItem("cozy9Fullness",String(p.fullness));localStorage.setItem("cozy9Fish",String(p.fish));localStorage.setItem("cozy9Inventory",JSON.stringify(p.inventory));localStorage.setItem("cozy10LastCheckin",p.lastCheckin);localStorage.setItem("cozy10CheckinStreak",String(p.checkinStreak));if(s.learning)localStorage.setItem(LEARNING_KEY,JSON.stringify(s.learning));for(const [date,d] of Object.entries(s.days)){localStorage.setItem("cozy9Learned-"+date,JSON.stringify(d.learned));localStorage.setItem("cozy9Claimed-"+date,JSON.stringify(d.claimed));if(d.quizRewarded)localStorage.setItem("cozy10QuizReward-"+date,"1");if(d.eventApplied)localStorage.setItem("cozy10EventApplied-"+date,"1")}if(s.needs)localStorage.setItem("cozy11Needs",JSON.stringify(s.needs));else localStorage.removeItem("cozy11Needs");localStorage.setItem("cozy11CatSleeping",s.sleeping?"1":"0");return true}'''
          new='''  function restoreWorld(world,onlyMissing=false){if(!world)return;const entries=[["cozyWorldEquippedV1",world.equipped],["cozyWorldKnownUnlocksV1",world.knownUnlocks],["cozyWorldMetricsV1",world.metrics]];for(const [key,value] of entries){if(value==null)continue;if(onlyMissing&&localStorage.getItem(key)!==null)continue;localStorage.setItem(key,JSON.stringify(value))}}
  function restore(data){const s=normalize(data);if(!s)return false;const p=s.profile;localStorage.setItem("cozy9Mood",String(p.mood));localStorage.setItem("cozy9Fullness",String(p.fullness));localStorage.setItem("cozy9Fish",String(p.fish));localStorage.setItem("cozy9Inventory",JSON.stringify(p.inventory));localStorage.setItem("cozy10LastCheckin",p.lastCheckin);localStorage.setItem("cozy10CheckinStreak",String(p.checkinStreak));if(s.learning)localStorage.setItem(LEARNING_KEY,JSON.stringify(s.learning));for(const [date,d] of Object.entries(s.days)){localStorage.setItem("cozy9Learned-"+date,JSON.stringify(d.learned));localStorage.setItem("cozy9Claimed-"+date,JSON.stringify(d.claimed));if(d.quizRewarded)localStorage.setItem("cozy10QuizReward-"+date,"1");if(d.eventApplied)localStorage.setItem("cozy10EventApplied-"+date,"1")}if(s.needs)localStorage.setItem("cozy11Needs",JSON.stringify(s.needs));else localStorage.removeItem("cozy11Needs");localStorage.setItem("cozy11CatSleeping",s.sleeping?"1":"0");restoreWorld(s.world,false);return true}'''
          if old not in s: raise SystemExit('save restore target not found')
          s=s.replace(old,new,1)

          old='''  function initialize(){try{const master=normalize(parse(localStorage.getItem(MASTER_KEY),null));if(hasCurrentData())saveMaster(collect(),false);else if(master)restore(master);else{const older=findOlderMaster();if(older){restore(older);saveMaster(collect(),false)}else saveMaster(collect(),false)}}catch(_){}}'''
          new='''  function initialize(){try{const master=normalize(parse(localStorage.getItem(MASTER_KEY),null));if(hasCurrentData()){if(master)restoreWorld(master.world,true);saveMaster(collect(),false)}else if(master)restore(master);else{const older=findOlderMaster();if(older){restore(older);saveMaster(collect(),false)}else saveMaster(collect(),false)}}catch(_){}}'''
          if old not in s: raise SystemExit('save initialize target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('app.js');s=p.read_text(encoding='utf-8')
          if "import('./cozy-world.js?v=1')" not in s: raise SystemExit('cozy-world import target not found')
          p.write_text(s.replace("import('./cozy-world.js?v=1')","import('./cozy-world.js?v=2')",1),encoding='utf-8')

          p=Path('sw.js');s=p.read_text(encoding='utf-8')
          if 'const CACHE = "cozy-cat-cute-v25";' not in s: raise SystemExit('cache v25 not found')
          s=s.replace('const CACHE = "cozy-cat-cute-v25";','const CACHE = "cozy-cat-cute-v26";',1)
          s=s.replace('"./cozy-world.js?v=1"','"./cozy-world.js?v=2"',1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html');s=p.read_text(encoding='utf-8')
          if '<script src="save-guard.js?v=8"></script>' not in s: raise SystemExit('save guard script target not found')
          s=s.replace('<script src="save-guard.js?v=8"></script>','<script src="save-guard.js?v=9"></script>',1)
          s=s.replace('<script src="app.js?v=8" defer></script>','<script src="app.js?v=9" defer></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify JavaScript
        run: |
          node --check cozy-world.js
          node --check save-guard.js
          node --check app.js
          node --check sw.js
          grep -q "knownUnlocks().includes" cozy-world.js
          grep -q "cozyWorldEquippedV1" save-guard.js
          grep -q "cozy-world.js?v=2" app.js
          grep -q "cozy-cat-cute-v26" sw.js
          grep -q "save-guard.js?v=9" index.html
      - name: Commit changes
        run: |
          rm -f .github/workflows/fix-world-persistence-v26.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cozy-world.js save-guard.js app.js sw.js index.html .github/workflows/fix-world-persistence-v26.yml
          git commit -m "Persist cat room collectibles permanently"
          git push
